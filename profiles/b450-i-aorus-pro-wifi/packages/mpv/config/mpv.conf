##################
# video settings #
##################

vo=gpu-next
gpu-api=vulkan
hwdec=vaapi-copy
profile=high-quality
temporal-dither=yes
deband=yes
deband-iterations=2
deband-threshold=35
deband-grain=5
dscale=mitchell
cscale=spline36
video-sync=display-resample
keep-open=yes

##################
# other settings #
##################

border=no
osd-bar=no

slang=eng,en,enUS
sub-auto=fuzzy
sub-font-size=44
demuxer-mkv-subtitle-preroll=yes
save-position-on-quit=yes

############
# Profiles #
############

[downscale-only]
profile-cond=get("width", 0) >= get("display-width", 99999)
profile-restore=copy
scale=mitchell
