# Fragment for ~/.config/smplayer/smplayer.ini
# Put these keys in the [advanced] section. SMPlayer intentionally starts
# mpv with --no-config, so mpv.conf/input.conf must be included explicitly.
[advanced]
disable_player_config=true
mplayer_additional_options="--include=/home/USER/.config/mpv/mpv.conf --input-conf=/home/USER/.config/mpv/input.conf"

# The path above must use the actual login name. Replace USER before use.
# Do not use user_args: it is not the SMPlayer playback option in current versions.
