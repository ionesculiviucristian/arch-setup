# Seek 1 second backward/forward using the Left/Right Arrow keys
LEFT seek -1 exact
RIGHT seek 1 exact

# Seek 1 second backward/forward using Shift + Left/Right Arrow keys
SHIFT+LEFT seek -1 exact
SHIFT+RIGHT seek 1 exact

# Optional: Mouse wheel seek by 1 second
WHEEL_UP seek 1 exact
WHEEL_DOWN seek -1 exact
