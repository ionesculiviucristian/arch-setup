# --- ENGINE & HARDWARE DECODING ---
# Modern rendering pipeline based on libplacebo.
vo=gpu-next
# Let mpv/SMPlayer select a compatible API (SMPlayer forces X11 EGL).
# Do not force Vulkan here: it conflicts with SMPlayer's --gpu-context=x11egl.
# Compatibility-oriented VA-API mode; decoded frames are copied to system RAM.
hwdec=vaapi-copy
profile=high-quality

# --- COLOR, CONTRAST & DITHERING ---
dither-depth=8
dither=fruit
temporal-dither=yes

# --- DEBANDING ---
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=5

# --- UPSCALING ---
scale=ewa_lanczossharp
dscale=mitchell
cscale=spline36

# --- ASPECT RATIO ---
keepaspect=yes

# --- AUDIO & SUBTITLES ---
slang=eng,en,enUS
alang=jpn,ja,eng,en
sub-auto=fuzzy
sub-font="sans-serif"
sub-font-size=44
demuxer-mkv-subtitle-preroll=yes

# --- MISC / QUALITY OF LIFE ---
keep-open=yes
save-position-on-quit=yes
cursor-autohide=1000
watch-later-directory=~/.config/mpv/watch_later
write-filename-in-watch-later-config=yes
